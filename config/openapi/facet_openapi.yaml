openapi: 3.1.0
info:
  title: Faceting API
  version: 1.0.0
paths:
  /api/facet/listing:
    get:
      operationId: listFacets
      summary: List facet definitions and aggregation metadata.
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Facet listing and aggregation metadata.
          content:
            application/json:
              schema:
                type: object
                required:
                  - total
                  - items
                  - aggregations
                properties:
                  total:
                    type: integer
                    minimum: 0
                  items:
                    type: array
                    items:
                      type: object
                  aggregations:
                    type: object
