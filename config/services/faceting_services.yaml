services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\Faceting\:
    resource: '../../src/'
    exclude:
      - '../../src/Kernel.php'
      - '../../src/Entity/'
      - '../../src/Enum/'
      - '../../src/ValueObject/'
      - '../../src/ServiceInterface/'

  App\Faceting\ServiceInterface\Facet\FacetingFacetServiceInterface: '@App\Faceting\Service\Facet\FacetingFacetService'
  App\Faceting\ServiceInterface\Report\FacetingReportServiceInterface: '@App\Faceting\Service\Report\FacetingReportService'
  App\Faceting\ServiceInterface\Demo\FacetingDemoDatasetServiceInterface: '@App\Faceting\Service\Demo\FacetingDemoDatasetService'
  App\Faceting\ServiceInterface\Demo\FacetingDemoSeederServiceInterface: '@App\Faceting\Service\Demo\FacetingDemoSeederService'
  App\Faceting\ServiceInterface\Listing\FacetingEngineServiceInterface: '@App\Faceting\Service\Listing\FacetingEngineService'
  App\Faceting\ServiceInterface\Listing\FacetingListingCriteriaBuilderServiceInterface: '@App\Faceting\Service\Listing\FacetingListingCriteriaBuilderService'
  App\Faceting\Service\Management\FacetManagementSurfaceBuilder:
    public: true
  App\Faceting\Service\Management\FacetManagementResponder:
    public: true
    tags: ['controller.service_arguments']
  App\Faceting\Service\Api\FacetingListingApiResponder:
    public: true

  App\Faceting\RepositoryInterface\FacetRepositoryInterface: '@App\Faceting\Repository\FacetRepository'
